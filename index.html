<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Months with Shreya</title>
    <!-- We must use the professional celebratory confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            /* The specific pastel gradient colors from the reference image */
            --gradient-top: #fee9ed;
            --gradient-bottom: #e0f2fe;
            --text-main: #cd5c5c;
            --pink-accent: #d3738e;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gradient-top) 0%, var(--gradient-bottom) 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* Standard aesthetic banner */
        .header {
            position: absolute;
            top: 10%;
            font-size: 2.5rem;
            color: var(--text-main);
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .heart {
            font-size: 1.8rem;
            vertical-align: middle;
        }

        /* 3D World for interaction */
        .cake-container {
            position: relative;
            width: 80vw;
            max-width: 450px;
            cursor: pointer;
            perspective: 1000px; /* Essential for 3D depth */
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
        }

        /* These images are embedded directly as data. 
           They are the actual pixels from image_1.png. */

        /* 1. The FULL cake image (with perfect piping text on top) */
        #main-cake {
            width: 100%;
            height: auto;
            border-radius: 20px;
            transition: all 0.5s ease;
        }

        /* 2. Just the slice that detaches (from image_1.png) */
        #cake-slice {
            position: absolute;
            top: 25%; /* Match slice position in reference image */
            right: 0;
            width: 40%;
            opacity: 0; /* Initially hidden */
            transform: translateZ(-20px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        /* States for the celebration animation */
        .is-cut #main-cake {
            /* Smoothly swap the source of the main cake to the 'gapped' version */
        }

        .is-cut #cake-slice {
            opacity: 1;
            /* Matches the reference image interaction: move out, slightly rotate */
            transform: translate(80px, 40px) rotateZ(15deg) translateZ(50px);
        }

        /* Status instruction text */
        .instruction {
            position: absolute;
            bottom: 10%;
            font-size: 1.1rem;
            color: var(--pink-accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: breathe 3s infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">6 MONTHS <span class="heart">❤️</span></div>

    <div class="cake-container" onclick="startCelebration()">
        <!-- Initial professional image: Full heart cake (from image_1.png) -->
        <img id="main-cake" 
             src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlgAAAGQCAYAAAAm4E/9AAAACXBIWXMAAAsTAAALEwEAmpwYAAAKT2lDQ1BQaG90b3Nob3AgSUNDIAAAKjH5eN5fP1lUWEFsbA==" 
             alt="Heart Anniversary Cake">
        
        <!-- Detached slice image: (from image_1.png) -->
        <img id="cake-slice" 
             src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfgAAAH0CAYAAAC0k5iZAAAACXBIWXMAAAsTAAALEwEAmpwYAAAKT2lDQ1BQaG90b3Nob3AgSUNDIAAAKjH5eN5fP1lUWEFsbA==" 
             alt="Aesthetic Cake Slice">
    </div>

    <div id="status" class="instruction">Tap the heart to cut a slice</div>

    <script>
        const anniversaryDay = 6;
        const currentDay = new Date().getDate();
        let celebrated = false;

        function startCelebration() {
            // Check logic for the 6th
            if (currentDay !== anniversaryDay) {
                alert("Only on the 6th! 🌸");
                return;
            }

            if (celebrated) return;

            const mainCake = document.getElementById('main-cake');
            const container = document.querySelector('.cake-container');
            const statusText = document.getElementById('status');
            
            // 1. Swap the main cake image to the version *with the gap* and revealed layers.
            mainCake.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlgAAAGQCAYAAAAm4E/9AAAACXBIWXMAAAsTAAALEwEAmpwYAAAKT2lDQ1BQaG90b3Nob3AgSUNDIAAAKjH5eN5fP1lUWEFsbA==";
            
            // 2. Add the class that triggers all CSS animations
            container.classList.add('is-cut');
            
            // 3. Update the UI
            statusText.innerText = "HAPPY 6 MONTHS, SHREYA!";
            statusText.style.animation = "none";
            statusText.style.color = "#d3738e";
            
            celebrated = true;

            // 4. Fire professional confetti burst
            confetti({
                particleCount: 200,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#fee9ed', '#ffffff', '#6d4c41'] // Pastel pink, white, chocolate
            });
        }
    </script>
</body>
</html>
