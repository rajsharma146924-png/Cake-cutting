<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 6 Months!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #fff0f3;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .header-container {
            position: absolute;
            top: 10%;
            width: 90%;
            text-align: center;
            z-index: 20;
        }

        h1 { color: #c9184a; margin: 0; font-size: 1.8rem; line-height: 1.2; }
        p { color: #ff4d6d; font-weight: bold; margin-top: 10px; font-size: 1rem; min-height: 1.2em; }

        .cake-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1/1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        #cake-slice {
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.1s;
        }

        .is-cut #cake-slice {
            opacity: 1;
            transform: translate(25px, -20px) rotate(12deg);
        }

        .candle-group {
            transition: opacity 0.4s ease;
        }

        .flame {
            fill: #ffa500;
            filter: drop-shadow(0 0 8px #ffa500);
            display: none;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.05); } }

        .gold-text {
            font-family: 'Dancing Script', cursive;
            fill: url(#goldGradient);
            filter: drop-shadow(1px 1.5px 1.5px rgba(0,0,0,0.2));
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 id="title">Our Special Day</h1>
        <p id="msg">Tap to light the candle 🕯️</p>
    </div>

    <div class="cake-container" onclick="celebrate()">
        <svg viewBox="0 0 200 200">
            <defs>
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#F5D061" />
                    <stop offset="50%" stop-color="#E6AF2E" />
                    <stop offset="100%" stop-color="#8B6914" />
                </linearGradient>
                <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="rgba(0,0,0,0.1)" />
                    <stop offset="100%" stop-color="rgba(0,0,0,0)" />
                </radialGradient>
            </defs>

            <!-- Ground Shadow -->
            <ellipse cx="100" cy="150" rx="60" ry="10" fill="url(#shadowGrad)" />

            <!-- Main Cake Body -->
            <path d="M 100,100 L 135,80 A 40,40 0 1 1 100,60 Z" fill="#ff85a1" />
            <path d="M 135,80 A 40,40 0 1 1 100,60" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" />

            <!-- The Plug (initial gap filler) -->
            <path id="cake-filler" d="M 100,100 L 100,60 A 40,40 0 0 1 135,80 Z" fill="#ff85a1" />
            <path id="initial-border" d="M 100,60 A 40,40 0 0 1 135,80" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" />

            <!-- Animated Slice -->
            <g id="cake-slice">
                <path d="M 100,100 L 100,60 A 40,40 0 0 1 135,80 Z" fill="#ff85a1" />
                <path d="M 100,60 A 40,40 0 0 1 135,80" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" />
            </g>

            <!-- The Candle (Anchored inside SVG) -->
            <g id="candle" class="candle-group">
                <rect x="96" y="25" width="8" height="40" rx="2" fill="#ffd6a5" />
                <path id="flame" class="flame" d="M 100,5 Q 106,15 100,22 Q 94,15 100,5" transform-origin="100 22" />
            </g>

            <!-- Text -->
            <text x="100" y="105" class="gold-text" font-size="14" text-anchor="middle">Happy</text>
            <text x="100" y="120" class="gold-text" font-size="14" text-anchor="middle">6 Months</text>
        </svg>
    </div>

    <script>
        let state = 0;
        function celebrate() {
            const flame = document.getElementById('flame');
            const container = document.querySelector('.cake-container');
            const msg = document.getElementById('msg');
            const title = document.getElementById('title');
            const candle = document.getElementById('candle');
            const filler = document.getElementById('cake-filler');
            const initialBorder = document.getElementById('initial-border');

            if (state === 0) {
                flame.style.display = 'block';
                msg.innerText = "Make a wish and cut the cake! 🎂";
                state = 1;
            } else if (state === 1) {
                filler.style.display = 'none';
                initialBorder.style.display = 'none';
                container.classList.add('is-cut');
                candle.style.opacity = '0';
                title.innerText = "Happy 6 Months, Shreya! ❤️";
                msg.innerText = "Another month down, forever to go!";
                
                confetti({
                    particleCount: 100,
                    spread: 60,
                    origin: { y: 0.7 },
                    colors: ['#FFD700', '#FFFFFF', '#FF85A1']
                });
                state = 2;
            }
        }
    </script>
</body>
</html>
