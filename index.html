<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Monthly 6th</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cake-color: #ff4d6d;
            --frosting-color: #ff85a1;
            --text-color: #ffffff;
        }

        body {
            background-color: #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #c9184a;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .scene {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Heart Cake Construction */
        .heart-cake {
            position: relative;
            width: 200px;
            height: 200px;
            background-color: var(--cake-color);
            transform: rotate(-45deg);
            transition: all 0.8s ease;
            box-shadow: -10px 10px 30px rgba(0,0,0,0.1);
        }

        .heart-cake::before,
        .heart-cake::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: var(--cake-color);
            border-radius: 50%;
        }

        .heart-cake::before { top: -100px; left: 0; }
        .heart-cake::after { left: 100px; top: 0; }

        /* Text on Cake */
        .cake-text {
            position: absolute;
            transform: rotate(45deg);
            width: 150px;
            text-align: center;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            top: 40px;
            left: 40px;
            pointer-events: none;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Candle */
        .candle {
            position: absolute;
            top: -20px;
            left: 50%;
            width: 10px;
            height: 40px;
            background: linear-gradient(to bottom, #ffd6a5, #ffadad);
            z-index: 15;
            transform: rotate(45deg); /* Correcting for heart rotation */
        }

        .flame {
            position: absolute;
            top: -20px;
            left: -2px;
            width: 14px;
            height: 20px;
            background: #ff9e00;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ff9e00;
            display: none;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* The Slice Effect */
        .slice {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #fff0f3; /* Matches background to look "cut" */
            top: -10px;
            right: -10px;
            transform: rotate(0deg);
            z-index: 12;
            display: none;
            clip-path: polygon(100% 0, 0 0, 100% 100%);
        }

        .cut-active .heart-cake {
            transform: rotate(-45deg) translate(-20px, 20px);
        }

        .instruction {
            margin-top: 40px;
            color: #ff4d6d;
            font-weight: 500;
        }

        .plate {
            position: absolute;
            bottom: 20px;
            width: 320px;
            height: 10px;
            background: #e9ecef;
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <h1 id="mainTitle">Our Special Day</h1>

    <div class="scene" onclick="handleStep()">
        <div class="heart-cake" id="cake">
            <div class="cake-text">Happy<br>6 Months</div>
            <div class="candle" id="candle">
                <div class="flame" id="flame"></div>
            </div>
            <div class="slice" id="slice"></div>
        </div>
        <div class="plate"></div>
    </div>

    <p class="instruction" id="status">Tap to light the candle 🕯️</p>

    <script>
        let step = 0;

        function handleStep() {
            const flame = document.getElementById('flame');
            const status = document.getElementById('status');
            const cake = document.getElementById('cake');
            const slice = document.getElementById('slice');
            const title = document.getElementById('mainTitle');

            if (step === 0) {
                // Step 1: Light Candle
                flame.style.display = 'block';
                status.innerText = "Make a wish and tap to cut! 🎂";
                step = 1;
            } else if (step === 1) {
                // Step 2: Cut Cake
                slice.style.display = 'block';
                cake.parentElement.classList.add('cut-active');
                flame.style.display = 'none';
                status.innerText = "Happy 6 Months, Shreya! ❤️";
                title.innerText = "Celebration Time!";

                // Heart-themed Confetti
                const end = Date.now() + 3000;
                const colors = ['#ff4d6d', '#ff758f', '#ffffff'];

                (function frame() {
                    confetti({
                        particleCount: 2,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: colors
                    });
                    confetti({
                        particleCount: 2,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: colors
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
                step = 2;
            }
        }
    </script>
</body>
</html>
