<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 6 Months!</title>
    <!-- Importing a elegant handwritten font -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #fff0f3;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        h1 { color: #c9184a; margin-bottom: 5px; font-size: 2rem; }
        p { color: #ff4d6d; font-weight: bold; margin-bottom: 20px; }

        .cake-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The slice piece animation */
        #cake-slice {
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: 50px 50px;
        }

        .is-cut #cake-slice {
            transform: translate(18px, -12px) rotate(8deg);
        }

        /* Candle styling */
        .candle-box {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .candle-stick {
            width: 10px;
            height: 45px;
            background: #ffd6a5;
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: -2px;
            width: 14px;
            height: 20px;
            background: #ffa500;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffa500;
            display: none;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Gold Gradient for the Font */
        .gold-text {
            font-family: 'Dancing Script', cursive;
            fill: url(#goldGradient);
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body>

    <h1 id="title">Our Special Day</h1>
    <p id="msg">Tap to light the candle 🕯️</p>

    <div class="cake-wrapper" onclick="celebrate()">
        <!-- Candle -->
        <div class="candle-box" id="candle">
            <div class="flame" id="flame"></div>
            <div class="candle-stick"></div>
        </div>

        <!-- SVG Cake -->
        <svg viewBox="0 0 100 100" width="320" height="320">
            <defs>
                <!-- Golden Gradient Definition -->
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#f9e272;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- Main Cake Body (No border) -->
            <path d="M 50,50 L 85,30 A 40,40 0 1 1 50,10 Z" fill="#ff85a1" />
            
            <!-- The Slice (No border) -->
            <g id="cake-slice">
                <path d="M 50,50 L 50,10 A 40,40 0 0 1 85,30 Z" fill="#ff85a1" />
            </g>

            <!-- Centered Golden Handwritten Text -->
            <text x="50" y="55" class="gold-text" font-size="10" text-anchor="middle" pointer-events="none">Happy</text>
            <text x="50" y="66" class="gold-text" font-size="10" text-anchor="middle" pointer-events="none">6 Months</text>
        </svg>
    </div>

    <script>
        let state = 0;

        function celebrate() {
            const flame = document.getElementById('flame');
            const wrapper = document.querySelector('.cake-wrapper');
            const msg = document.getElementById('msg');
            const title = document.getElementById('title');
            const candle = document.getElementById('candle');

            if (state === 0) {
                flame.style.display = 'block';
                msg.innerText = "Now, click to cut our cake! 🎂";
                state = 1;
            } else if (state === 1) {
                wrapper.classList.add('is-cut');
                candle.style.display = 'none';
                title.innerText = "Happy 6 Months, Shreya! ❤️";
                msg.innerText = "Another month down, forever to go!";
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff85a1', '#ffffff', '#ffd700']
                });
                state = 2;
            }
        }
    </script>
</body>
</html>
