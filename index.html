<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 6 Months!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #fff0f3;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        h1 { color: #c9184a; margin-bottom: 5px; font-size: 1.8rem; }
        p { color: #ff4d6d; font-weight: bold; margin-bottom: 20px; }

        .cake-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            cursor: pointer;
        }

        /* The slice piece - locked into the SVG grid */
        #cake-slice {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: 50px 50px;
        }

        .is-cut #cake-slice {
            transform: translate(15px, -10px) rotate(10deg);
        }

        /* Candle placement */
        .candle-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .candle-stick {
            width: 10px;
            height: 40px;
            background: #ffd6a5;
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: -2px;
            width: 14px;
            height: 20px;
            background: #ffa500;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffa500;
            display: none;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <h1 id="title">Our Special Day</h1>
    <p id="msg">Tap to light the candle 🕯️</p>

    <div class="cake-wrapper" onclick="celebrate()">
        <!-- Candle -->
        <div class="candle-box" id="candle">
            <div class="flame" id="flame"></div>
            <div class="candle-stick"></div>
        </div>

        <!-- The Cake (Single SVG ensures nothing moves out of place) -->
        <svg viewBox="0 0 100 100" width="300" height="300">
            <!-- Main Cake Body (Circle with a slice missing) -->
            <path d="M 50,50 L 85,30 A 40,40 0 1 1 50,10 Z" fill="#ff85a1" stroke="white" stroke-width="2" />
            
            <!-- The Slice Piece (Perfectly fits the gap above) -->
            <g id="cake-slice">
                <path d="M 50,50 L 50,10 A 40,40 0 0 1 85,30 Z" fill="#ff85a1" stroke="white" stroke-width="2" />
            </g>

            <!-- Text locked to the center -->
            <text x="50" y="55" fill="white" font-size="6" font-weight="bold" text-anchor="middle" pointer-events="none">Happy</text>
            <text x="50" y="63" fill="white" font-size="6" font-weight="bold" text-anchor="middle" pointer-events="none">6 Months</text>
        </svg>
    </div>

    <script>
        let state = 0;

        function celebrate() {
            const flame = document.getElementById('flame');
            const wrapper = document.querySelector('.cake-wrapper');
            const msg = document.getElementById('msg');
            const title = document.getElementById('title');
            const candle = document.getElementById('candle');

            if (state === 0) {
                flame.style.display = 'block';
                msg.innerText = "Now, click to cut our cake! 🎂";
                state = 1;
            } else if (state === 1) {
                wrapper.classList.add('is-cut');
                candle.style.display = 'none';
                title.innerText = "Happy 6 Months, Shreya! ❤️";
                msg.innerText = "Another month down, forever to go!";
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff85a1', '#ffffff', '#c9184a']
                });
                state = 2;
            }
        }
    </script>
</body>
</html>
