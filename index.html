<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Months Celebration</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cake-pink: #ff85a1;
            --cream: #fff;
            --chocolate: #5d4037;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff5f8 0%, #fbc2eb 100%);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        .anniversary-label {
            position: absolute;
            top: 15%;
            font-size: 2.5rem;
            font-weight: bold;
            color: #d81b60;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            z-index: 20;
        }

        /* 3D Cake Container */
        .cake-scene {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            transform: rotateX(45deg) rotateZ(-10deg);
            transition: transform 0.5s ease;
        }

        /* The Heart Shape Construction */
        .heart-cake {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* This creates the 'Happy 6 Months' text physically on the cake */
        .heart-cake::before {
            content: "Happy 6 months";
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%) translateZ(61px);
            font-family: 'Brush Script MT', cursive;
            color: white;
            font-size: 1.8rem;
            width: 100%;
            text-align: center;
            z-index: 100;
        }

        /* CSS Heart Shapes */
        .layer {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--cake-pink);
            left: 50px;
            top: 50px;
        }

        .layer::before, .layer::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: inherit;
            border-radius: 50%;
        }
        .layer::before { top: -100px; left: 0; }
        .layer::after { left: 100px; top: 0; }

        /* The Mid-section (The Layers) */
        .mid-section {
            background: repeating-linear-gradient(
                var(--chocolate),
                var(--chocolate) 20px,
                var(--cream) 20px,
                var(--cream) 40px
            );
            transform: translateZ(30px);
            height: 60px;
        }

        /* The Slice Animation */
        .slice {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            clip-path: polygon(50% 50%, 100% 0, 100% 50%);
        }

        .is-cut .slice {
            transform: translate(80px, -40px) translateZ(20px) rotateZ(20deg);
        }

        .instruction {
            position: absolute;
            bottom: 10%;
            color: #ad1457;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="anniversary-label">6 Months ❤️</div>

    <div class="cake-scene">
        <div id="heart" class="heart-cake" onclick="cutCake()">
            <!-- Top Frosting -->
            <div class="layer" style="transform: translateZ(60px);"></div>
            
            <!-- Mid Section (revealed when sliced) -->
            <div class="layer mid-section"></div>
            
            <!-- Bottom Base -->
            <div class="layer" style="transform: translateZ(0);"></div>

            <!-- The Slice that moves -->
            <div class="slice">
                <div class="layer" style="transform: translateZ(61px);"></div>
                <div class="layer mid-section" style="transform: translateZ(30px);"></div>
            </div>
        </div>
    </div>

    <div class="instruction">Tap the heart to cut a slice</div>

    <script>
        function cutCake() {
            // Logic to check if today is the 6th
            const today = new Date().getDate();
            if (today !== 6) {
                alert("Only on the 6th! 😉");
                return;
            }

            document.getElementById('heart').classList.add('is-cut');
            
            // Celebration confetti
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff85a1', '#ffffff', '#5d4037']
            });
        }
    </script>
</body>
</html>
