<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 6 Months!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #fff0f3;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 { 
            color: #c9184a; 
            margin: 0 0 10px 0; 
            font-size: clamp(1.5rem, 6vw, 2.2rem); 
            text-align: center;
        }
        
        p { 
            color: #ff4d6d; 
            font-weight: bold; 
            margin-bottom: 20px; 
            height: 24px;
            text-align: center;
        }

        .cake-wrapper {
            position: relative;
            width: 100%;
            max-width: 380px; 
            aspect-ratio: 1/1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cake-shadow {
            position: absolute;
            width: 60%;
            height: 10%;
            background: rgba(0,0,0,0.06);
            border-radius: 50%;
            bottom: 15%;
            filter: blur(10px);
            z-index: 0;
        }

        #cake-slice {
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.1s;
            transform-origin: 75px 75px;
        }

        .is-cut #cake-slice {
            opacity: 1;
            transform: translate(25px, -20px) rotate(12deg);
        }

        .candle-box {
            position: absolute;
            top: 20%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .candle-stick {
            width: 8px;
            height: 40px;
            background: #ffd6a5;
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: -3px;
            width: 14px;
            height: 22px;
            background: radial-gradient(circle at center, #fff, #ffa500, #ff4500);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffa500;
            display: none;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

        .gold-text {
            font-family: 'Dancing Script', cursive;
            fill: url(#goldGradient);
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3));
            dominant-baseline: middle;
        }
    </style>
</head>
<body>

    <h1 id="title">Our Special Day</h1>
    <p id="msg">Tap to light the candle 🕯️</p>

    <div class="cake-wrapper" onclick="celebrate()">
        <div class="cake-shadow"></div>
        <div class="candle-box" id="candle">
            <div class="flame" id="flame"></div>
            <div class="candle-stick"></div>
        </div>

        <svg viewBox="0 0 150 150" width="100%" height="100%">
            <defs>
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#F5D061" />
                    <stop offset="50%" stop-color="#E6AF2E" />
                    <stop offset="100%" stop-color="#8B6914" />
                </linearGradient>
                
                <g id="even-sprinkles">
                    <!-- Left Side -->
                    <circle cx="45" cy="65" r="0.8" fill="#FFFFFF"/>
                    <circle cx="40" cy="85" r="0.8" fill="#FFD700"/>
                    <circle cx="50" cy="105" r="0.8" fill="#c9184a"/>
                    <!-- Bottom Side -->
                    <circle cx="75" cy="112" r="0.8" fill="#FFFFFF"/>
                    <circle cx="60" cy="115" r="0.8" fill="#FFD700"/>
                    <circle cx="90" cy="110" r="0.8" fill="#c9184a"/>
                    <!-- Right Side -->
                    <circle cx="110" cy="90" r="0.8" fill="#FFFFFF"/>
                    <circle cx="105" cy="70" r="0.8" fill="#FFD700"/>
                    <circle cx="100" cy="100" r="0.8" fill="#c9184a"/>
                    <!-- Inner Ring -->
                    <circle cx="60" cy="55" r="0.8" fill="#c9184a"/>
                    <circle cx="55" cy="80" r="0.8" fill="#FFD700"/>
                    <circle cx="75" cy="45" r="0.8" fill="#FFFFFF"/>
                </g>
            </defs>

            <!-- Main Cake Body -->
            <path d="M 75,75 L 110,55 A 40,40 0 1 1 75,35 Z" fill="#ff85a1" />
            <use href="#even-sprinkles" />
            <path d="M 110,55 A 40,40 0 1 1 75,35" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />

            <!-- The Plug (visible before cutting) -->
            <path id="cake-filler" d="M 75,75 L 75,35 A 40,40 0 0 1 110,55 Z" fill="#ff85a1" />
            <path id="initial-border" d="M 75,35 A 40,40 0 0 1 110,55" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />
            
            <!-- The Slice (distributed sprinkles) -->
            <g id="cake-slice">
                <path d="M 75,75 L 75,35 A 40,40 0 0 1 110,55 Z" fill="#ff85a1" />
                <circle cx="82" cy="45" r="0.8" fill="#FFFFFF"/>
                <circle cx="95" cy="48" r="0.8" fill="#FFD700"/>
                <circle cx="88" cy="55" r="0.8" fill="#c9184a"/>
                <circle cx="102" cy="52" r="0.8" fill="#FFFFFF"/>
                <path d="M 75,35 A 40,40 0 0 1 110,55" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />
            </g>

            <text x="75" y="80" class="gold-text" font-size="12" text-anchor="middle" pointer-events="none">Happy</text>
            <text x="75" y="94" class="gold-text" font-size="12" text-anchor="middle" pointer-events="none">6 Months</text>
        </svg>
    </div>

    <script>
        let state = 0;
        function celebrate() {
            const flame = document.getElementById('flame');
            const wrapper = document.querySelector('.cake-wrapper');
            const msg = document.getElementById('msg');
            const title = document.getElementById('title');
            const candle = document.getElementById('candle');
            const filler = document.getElementById('cake-filler');
            const initialBorder = document.getElementById('initial-border');

            if (state === 0) {
                flame.style.display = 'block';
                msg.innerText = "Make a wish and cut the cake! 🎂";
                state = 1;
            } else if (state === 1) {
                filler.style.display = 'none';
                initialBorder.style.display = 'none';
                wrapper.classList.add('is-cut');
                candle.style.opacity = '0';
                title.innerText = "Happy 6 Months, Shreya! ❤️";
                msg.innerText = "";
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#FFD700', '#FFFFFF', '#FF85A1']
                });
                state = 2;
            }
        }
    </script>
</body>
</html>
