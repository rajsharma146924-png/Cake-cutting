<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Monthly 6th</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cake-color: #f3e5f5;
            --frosting-color: #ff80ab;
            --plate-color: #e0e0e0;
        }

        body {
            background-color: #fff5f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .container {
            position: relative;
            cursor: pointer;
        }

        /* Cake Styling */
        .cake {
            position: relative;
            width: 250px;
            height: 150px;
            background: var(--cake-color);
            border-radius: 10px 10px 0 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .frosting {
            position: absolute;
            top: 0;
            width: 100%;
            height: 40px;
            background: var(--frosting-color);
            border-radius: 10px 10px 0 0;
            z-index: 2;
        }

        .plate {
            width: 300px;
            height: 20px;
            background: var(--plate-color);
            border-radius: 20px;
            margin-top: -5px;
        }

        /* Candle Styling */
        .candle {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 50px;
            background: linear-gradient(to bottom, #ffeb3b, #fbc02d);
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 25px;
            background: #ff9800;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 20px #ffeb3b;
            animation: flicker 0.1s infinite alternate;
            display: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-52%) scale(1.1); }
        }

        /* Interactive Elements */
        .instruction {
            margin-top: 30px;
            color: #880e4f;
            font-size: 1.1rem;
            transition: opacity 0.5s;
        }

        .slice-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: white;
            transform: scaleY(0);
            transition: transform 0.8s ease-in-out;
            z-index: 3;
        }

        .cut-active .slice-line {
            transform: scaleY(1);
        }

        .cut-active .cake {
            animation: split 1s forwards;
        }

        @keyframes split {
            to { filter: brightness(1.05); }
        }
    </style>
</head>
<body>

    <h1 id="title">Happy Anniversary!</h1>

    <div class="container" id="cakeContainer" onclick="handleInteraction()">
        <div class="candle">
            <div class="flame" id="flame"></div>
        </div>
        <div class="cake" id="cakeBody">
            <div class="frosting"></div>
            <div class="slice-line"></div>
        </div>
        <div class="plate"></div>
    </div>

    <p class="instruction" id="statusText">Click to light the candle 🕯️</p>

    <script>
        let stage = 0;

        function handleInteraction() {
            const flame = document.getElementById('flame');
            const status = document.getElementById('statusText');
            const container = document.getElementById('cakeContainer');

            if (stage === 0) {
                // Light the candle
                flame.style.display = 'block';
                status.innerText = "Now, click to cut the cake together 🎂";
                stage = 1;
            } else if (stage === 1) {
                // Cut the cake
                container.classList.add('cut-active');
                flame.style.display = 'none';
                status.innerText = "Another month down, forever to go! ❤️";
                
                // Trigger Confetti
                var duration = 3 * 1000;
                var end = Date.now() + duration;

                (function frame() {
                    confetti({
                        particleCount: 3,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#ff80ab', '#d81b60', '#f3e5f5']
                    });
                    confetti({
                        particleCount: 3,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#ff80ab', '#d81b60', '#f3e5f5']
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
                stage = 2;
            }
        }
    </script>
</body>
</html>
