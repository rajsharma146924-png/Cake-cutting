<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Months Celebration</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #fff5f8 0%, #fbc2eb 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        .header {
            color: #d81b60;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* The 3D World */
        .cake-container {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            transform: rotateX(45deg) rotateZ(-10deg);
            cursor: pointer;
            transition: transform 0.5s ease;
        }

        .cake-container:hover {
            transform: rotateX(45deg) rotateZ(5deg);
        }

        /* The Heart Cake Body */
        .heart-shape {
            position: absolute;
            width: 200px;
            height: 200px;
            background: #ff85a1; /* Pink frosting */
            transform-style: preserve-3d;
        }

        .heart-shape:before, .heart-shape:after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: inherit;
            border-radius: 50%;
        }

        .heart-shape:before { top: -100px; left: 0; }
        .heart-shape:after { left: 100px; top: 0; }

        /* The Message on top */
        .message-on-cake {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Brush Script MT', cursive;
            font-size: 1.8rem;
            transform: translateZ(62px);
            pointer-events: none;
            text-align: center;
        }

        /* Layered interior (Chocolate and Cream) */
        .interior {
            background: repeating-linear-gradient(
                #5d4037, #5d4037 15px, 
                #fff 15px, #fff 30px
            );
            transform: translateZ(30px);
            height: 60px;
            width: 200px;
        }

        /* Slicing Animation */
        .slice-group {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            clip-path: polygon(50% 50%, 100% 0, 100% 50%);
        }

        .is-cut .slice-group {
            transform: translate(100px, -50px) translateZ(40px) rotateZ(20deg);
        }

        .footer {
            margin-top: 80px;
            color: #ad1457;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="header">6 MONTHS ❤️</div>

    <div class="cake-container" id="cake" onclick="handleSlice()">
        <!-- The Main Cake -->
        <div class="heart-shape" style="transform: translateZ(0);"></div>
        <div class="heart-shape interior"></div>
        <div class="heart-shape" style="transform: translateZ(60px);">
            <div class="message-on-cake">Happy 6 months</div>
        </div>

        <!-- The Slice -->
        <div class="slice-group">
            <div class="heart-shape" style="transform: translateZ(0); background: #ff85a1;"></div>
            <div class="heart-shape interior"></div>
            <div class="heart-shape" style="transform: translateZ(60.5px); background: #ff85a1;"></div>
        </div>
    </div>

    <div class="footer" id="instruction">Tap the heart to cut our cake</div>

    <script>
        function handleSlice() {
            const today = new Date().getDate();
            if (today !== 6) {
                alert("Patience! No cake until the 6th. 🍰");
                return;
            }

            document.getElementById('cake').classList.add('is-cut');
            document.getElementById('instruction').innerText = "HAPPY HALF-ANNIVERSARY, SHREYA!";
            
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff85a1', '#ffffff', '#5d4037']
            });
        }
    </script>
</body>
</html>
