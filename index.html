<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 6 Months!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #fff0f3;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        #ui-layer {
            position: absolute;
            top: 10%;
            z-index: 10;
        }

        h1 { color: #c9184a; margin: 0; font-size: 2rem; }
        p { color: #ff4d6d; font-weight: bold; margin-top: 10px; }

        #cake-container {
            position: relative;
            width: 350px;
            height: 350px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Heart */
        .heart {
            position: relative;
            width: 200px;
            height: 200px;
            background-color: #ff4d6d;
            transform: rotate(-45deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.5s ease;
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .heart::before { top: -100px; left: 0; }
        .heart::after { left: 100px; top: 0; }

        /* The Text on Cake */
        .cake-label {
            position: absolute;
            z-index: 5;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            width: 100%;
            text-align: center;
        }

        /* The Candle */
        .candle {
            position: absolute;
            bottom: 60%;
            width: 12px;
            height: 50px;
            background: #ffd6a5;
            border-radius: 4px;
            z-index: 6;
        }

        .flame {
            position: absolute;
            top: -20px;
            left: -2px;
            width: 16px;
            height: 24px;
            background: #ffa500;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffa500;
            animation: flicker 0.1s infinite alternate;
            display: none;
        }

        @keyframes flicker {
            from { transform: scale(1); } to { transform: scale(1.1); }
        }

        /* Slice Animation */
        .cut-active .heart {
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 50%, 100% 55%, 100% 100%, 0% 100%);
        }

        #footer-text {
            position: absolute;
            bottom: 15%;
            color: #c9184a;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="title">Our Special Day</h1>
        <p id="instruction">Tap to light the candle 🕯️</p>
    </div>

    <div id="cake-container" onclick="nextStep()">
        <div class="candle" id="candle-obj">
            <div class="flame" id="flame-obj"></div>
        </div>
        <div class="cake-label">Happy<br>6 Months</div>
        <div class="heart" id="heart-obj"></div>
    </div>

    <div id="footer-text"></div>

    <script>
        let state = 0;

        function nextStep() {
            const flame = document.getElementById('flame-obj');
            const instruction = document.getElementById('instruction');
            const container = document.getElementById('cake-container');
            const footer = document.getElementById('footer-text');
            const title = document.getElementById('title');
            const candle = document.getElementById('candle-obj');

            if (state === 0) {
                flame.style.display = 'block';
                instruction.innerText = "Now, make a wish and tap to cut! 🎂";
                state = 1;
            } else if (state === 1) {
                container.classList.add('cut-active');
                candle.style.display = 'none';
                instruction.style.display = 'none';
                title.innerText = "Happy 6 Months, Shreya! ❤️";
                footer.innerText = "Another month down, forever to go!";
                
                // Confetti Burst
                const count = 200;
                const defaults = { origin: { y: 0.7 } };

                function fire(particleRatio, opts) {
                    confetti({
                        ...defaults,
                        ...opts,
                        particleCount: Math.floor(count * particleRatio)
                    });
                }

                fire(0.25, { spread: 26, startVelocity: 55 });
                fire(0.2, { spread: 60 });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
                fire(0.1, { spread: 120, startVelocity: 45 });

                state = 2;
            }
        }
    </script>
</body>
</html>
