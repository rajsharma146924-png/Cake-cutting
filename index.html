<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 6 Months!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #fff0f3;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        h1 { color: #c9184a; margin-bottom: 5px; font-size: 1.8rem; }
        #instruction { color: #ff4d6d; margin-bottom: 20px; font-weight: bold; height: 24px; }

        .cake-container {
            position: relative;
            width: 300px;
            height: 300px;
            cursor: pointer;
        }

        /* The main heart */
        .heart-main {
            fill: #ff4d6d;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            transition: transform 0.5s ease;
        }

        /* The slice piece */
        #cake-slice {
            fill: #ff4d6d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none; /* Hidden until candle is lit */
        }

        .cake-text {
            fill: white;
            font-weight: bold;
            font-size: 8px;
            pointer-events: none;
        }

        /* Candle */
        #candle {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 40px;
            background: #ffd6a5;
            border-radius: 3px;
            z-index: 10;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: -2px;
            width: 14px;
            height: 20px;
            background: #ffa500;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffa500;
            animation: flicker 0.1s infinite alternate;
            display: none;
        }

        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Animation class */
        .is-cut #cake-slice {
            transform: translate(30px, -20px) rotate(10deg);
        }
    </style>
</head>
<body>

    <h1 id="header">Our Special Day</h1>
    <p id="instruction">Click to light the candle 🕯️</p>

    <div class="cake-container" onclick="handleCake()">
        <div id="candle">
            <div class="flame" id="flame"></div>
        </div>
        
        <svg viewBox="0 0 100 100" width="300" height="300">
            <!-- The Main Heart with a piece missing -->
            <path class="heart-main" d="M50 88 C48.5 86.5 2 48.5 2 30 A20 20 0 0 1 30 10 C37 10 44 14 50 20 C56 14 63 10 70 10 A20 20 0 0 1 98 30 C98 48.5 70 65 65 55 L50 40 L40 60 C40 65 51.5 86.5 50 88 Z" />
            
            <!-- The Slice Piece -->
            <path id="cake-slice" d="M50 40 L65 55 C70 65 98 48.5 98 30 A20 20 0 0 0 75 12 L50 40" />
            
            <text x="50" y="48" class="cake-text" text-anchor="middle">Happy</text>
            <text x="50" y="58" class="cake-text" text-anchor="middle">6 Months</text>
        </svg>
    </div>

    <script>
        let step = 0;

        function handleCake() {
            const flame = document.getElementById('flame');
            const slice = document.getElementById('cake-slice');
            const instr = document.getElementById('instruction');
            const header = document.getElementById('header');
            const container = document.querySelector('.cake-container');
            const candle = document.getElementById('candle');

            if (step === 0) {
                // Light candle
                flame.style.display = 'block';
                slice.style.display = 'block';
                instr.innerText = "Now, click to cut the cake! 🎂";
                step = 1;
            } else if (step === 1) {
                // Cut cake
                container.classList.add('is-cut');
                candle.style.display = 'none';
                header.innerText = "Happy 6 Months, Shreya! ❤️";
                instr.innerText = "Another month down, forever to go!";
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff4d6d', '#ff85a1', '#ffffff']
                });
                step = 2;
            }
        }
    </script>
</body>
</html>
