<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 6 Months!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #fff0f3;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }

        .container {
            position: relative;
            width: 320px;
            height: 400px;
            cursor: pointer;
            user-select: none;
        }

        h1 { color: #c9184a; font-weight: 600; margin-bottom: 10px; }
        #msg { color: #ff4d6d; font-size: 1.1rem; height: 30px; }

        /* The Heart Container */
        .cake-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        /* Using a reliable Unicode/CSS heart combo that won't distort */
        .heart-base {
            font-size: 250px;
            color: #ff4d6d;
            line-height: 300px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
        }

        .cake-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            width: 80%;
            line-height: 1.2;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Candle */
        .candle {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 45px;
            background: linear-gradient(#ffd6a5, #ffadad);
            border-radius: 4px;
            z-index: 10;
        }

        .flame {
            position: absolute;
            top: -20px;
            left: -2px;
            width: 16px;
            height: 24px;
            background: #ffa500;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffa500;
            animation: flicker 0.1s infinite alternate;
            display: none;
        }

        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* The "Slice" - a simple white overlay that appears to cut the heart */
        .slice-cut {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: #fff0f3; /* Matches background */
            z-index: 4;
            transition: all 0.6s ease-in-out;
            clip-path: polygon(50% 50%, 100% 0, 100% 100%);
        }

        .is-cut .slice-cut {
            width: 150px;
            height: 150px;
            transform: translate(0, -75px);
        }

    </style>
</head>
<body>

    <h1 id="title">Our Special Day</h1>
    <p id="msg">Tap to light the candle 🕯️</p>

    <div class="container" onclick="next()">
        <div class="candle" id="candle">
            <div class="flame" id="flame"></div>
        </div>
        
        <div class="cake-wrapper" id="cake">
            <div class="heart-base">❤</div>
            <div class="cake-text">Happy<br>6 Months</div>
            <div class="slice-cut"></div>
        </div>
    </div>

    <script>
        let step = 0;

        function next() {
            const flame = document.getElementById('flame');
            const candle = document.getElementById('candle');
            const cake = document.getElementById('cake');
            const msg = document.getElementById('msg');
            const title = document.getElementById('title');

            if (state === 0) {
                // Light
                flame.style.display = 'block';
                msg.innerText = "Make a wish and tap to cut! 🎂";
                state = 1;
            } else if (state === 1) {
                // Cut
                cake.classList.add('is-cut');
                candle.style.display = 'none';
                title.innerText = "Happy 6 Months, Shreya! ❤️";
                msg.innerText = "Another month down, forever to go!";
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff4d6d', '#ffffff', '#ff85a1']
                });
                state = 2;
            }
        }
        var state = 0; // init state
    </script>
</body>
</html>
