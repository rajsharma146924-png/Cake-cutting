<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 6 Months!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cake-pink: #ff85a1;
            --frosting-white: #ffffff;
            --bg-pink: #fff0f3;
        }

        body {
            background-color: var(--bg-pink);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        h1 { color: #c9184a; margin-bottom: 5px; }
        #instruction { color: #ff4d6d; font-weight: bold; margin-bottom: 20px; height: 20px; }

        .cake-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* The Pink Heart */
        .heart {
            position: relative;
            width: 180px;
            height: 180px;
            background-color: var(--cake-pink);
            transform: rotate(-45deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            /* Frosting Border */
            border: 6px dotted var(--frosting-white);
            transition: transform 0.6s ease;
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: var(--cake-pink);
            border-radius: 50%;
            border: 6px dotted var(--frosting-white);
            box-sizing: border-box;
        }

        .heart::before { top: -95px; left: -6px; }
        .heart::after { left: 89px; top: -6px; }

        /* Label on Top */
        .label {
            position: absolute;
            z-index: 10;
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
            text-align: center;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* The Candle */
        .candle {
            position: absolute;
            top: 20px;
            width: 12px;
            height: 45px;
            background: #ffd6a5;
            border-radius: 4px;
            z-index: 15;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: -1px;
            width: 14px;
            height: 20px;
            background: #ffa500;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffa500;
            display: none;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* The Cut Slice Animation */
        .slice-overlay {
            position: absolute;
            width: 100px;
            height: 100px;
            background: var(--bg-pink);
            right: 15px;
            top: 60px;
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
            display: none;
            z-index: 11;
        }

        .active-cut .slice-overlay {
            display: block;
            animation: sliceOut 0.8s forwards;
        }

        @keyframes sliceOut {
            from { transform: translate(0, 0); }
            to { transform: translate(30px, -20px); background-color: var(--cake-pink); border: 3px dotted white;}
        }
    </style>
</head>
<body>

    <h1 id="title">Happy Anniversary!</h1>
    <p id="instruction">Tap to light the candle 🕯️</p>

    <div class="cake-container" onclick="handleStep()">
        <div class="candle" id="candle">
            <div class="flame" id="flame"></div>
        </div>
        
        <div class="label">Happy<br>6 Months</div>
        <div class="heart" id="mainHeart"></div>
        <div class="slice-overlay" id="slice"></div>
    </div>

    <script>
        let step = 0;

        function handleStep() {
            const flame = document.getElementById('flame');
            const candle = document.getElementById('candle');
            const container = document.querySelector('.cake-container');
            const instr = document.getElementById('instruction');
            const title = document.getElementById('title');

            if (step === 0) {
                flame.style.display = 'block';
                instr.innerText = "Make a wish and tap to cut! 🎂";
                step = 1;
            } else if (step === 1) {
                container.classList.add('active-cut');
                candle.style.display = 'none';
                title.innerText = "Happy 6 Months, Shreya! ❤️";
                instr.innerText = "Another month down, forever to go!";
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff85a1', '#ffffff', '#c9184a']
                });
                step = 2;
            }
        }
    </script>
</body>
</html>
